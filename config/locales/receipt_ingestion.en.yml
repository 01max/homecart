en:
  receipt_ingestion:
    detect_duplicate:
      errors:
        duplicate_receipt: "receipt duplicates existing receipt %{receipt_id}"
      warnings:
        suspected_duplicate:
          detail: "Possible duplicate of receipt %{receipt_id}"
    extract_image_with_tesseract:
      errors:
        empty_text: "tesseract returned empty text"
        missing_preprocessor: "image preprocessing requested but no preprocessor was provided"
        missing_version: "could not detect tesseract version"
        failed: "tesseract failed"
        failed_with_detail: "tesseract failed: %{detail}"
    extract_pdf:
      errors:
        empty_text: "pdftotext returned empty text"
        failed: "pdftotext failed"
        failed_with_detail: "pdftotext failed: %{detail}"
    extract_text:
      errors:
        missing_original_file: "source document has no original file"
        unsupported_mime_type: "unsupported MIME type: %{mime_type}"
    manual_classify_source_document:
      errors:
        missing_successful_text_extraction: "source document has no successful text extraction to classify"
    parse:
      errors:
        missing_promotion_linked_line: "promotion linked_line_position %{position} did not match a persisted line"
    rerun_parser:
      errors:
        missing_successful_text_extraction: "receipt has no successful text extraction to parse"
    parser_warnings:
      parser_exception:
        detail: "Parser failed: %{detail}"
      missing_vat_code:
        detail: "No VAT table row found for code %{vat_code}"
      totals_sum_mismatch:
        detail:
          one: "Line totals differ from receipt total by %{discrepancy} cent"
          other: "Line totals differ from receipt total by %{discrepancy} cents"
      article_count_mismatch:
        detail: "Article count differs from declared count by %{discrepancy}"
      payments_sum_mismatch:
        detail:
          one: "Payment sum differs from receipt total by %{discrepancy} cent"
          other: "Payment sum differs from receipt total by %{discrepancy} cents"
    upload:
      errors:
        unsupported_mime_type: "unsupported MIME type: %{mime_type}; supported types: %{supported_types}"
