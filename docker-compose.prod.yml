services:
  app:
    build:
      context: .
      args:
        RUBY_VERSION: 4.0.5
    image: homecart:latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: homecart
      POSTGRES_PASSWORD: homecart
      RAILS_ENV: production
      RAILS_LOG_LEVEL: debug
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/up >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - ./config/master.key:/rails/config/master.key:ro
      - rails_storage:/rails/storage
    command: ["./bin/thrust", "./bin/rails", "server", "-b", "0.0.0.0"]

  worker:
    image: homecart:latest
    depends_on:
      app:
        condition: service_healthy
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: homecart
      POSTGRES_PASSWORD: homecart
      RAILS_ENV: production
      RAILS_LOG_LEVEL: debug
    volumes:
      - ./config/master.key:/rails/config/master.key:ro
      - rails_storage:/rails/storage
    command: ["bash", "-lc", "./bin/rails db:prepare && ./bin/jobs"]

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: homecart
      POSTGRES_PASSWORD: homecart
      POSTGRES_DB: homecart_production
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homecart -d homecart_production"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  rails_storage:
