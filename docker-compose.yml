services:
  app:
    build:
      context: .
      target: development
      args:
        RUBY_VERSION: 4.0.5
    image: homecart-dev:latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: homecart
      POSTGRES_PASSWORD: homecart
      RAILS_ENV: development
      RAILS_LOG_LEVEL: debug
      APP_HOST_PORT: ${HOMECART_WEB_PORT:-3001}
    ports:
      - "${HOMECART_WEB_PORT:-3001}:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/up >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - .:/rails
      - bundle_cache:/usr/local/bundle
      - rails_storage:/rails/storage
    command: ["bash", "-lc", "./bin/rails db:prepare && ./bin/rails server -b 0.0.0.0 -p 3000"]

  worker:
    build:
      context: .
      target: development
      args:
        RUBY_VERSION: 4.0.5
    image: homecart-dev:latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: homecart
      POSTGRES_PASSWORD: homecart
      RAILS_ENV: development
      RAILS_LOG_LEVEL: debug
      APP_HOST_PORT: ${HOMECART_WEB_PORT:-3001}
    volumes:
      - .:/rails
      - bundle_cache:/usr/local/bundle
      - rails_storage:/rails/storage
    command: ["bash", "-lc", "./bin/rails db:prepare && ./bin/jobs"]

  css:
    build:
      context: .
      target: development
      args:
        RUBY_VERSION: 4.0.5
    image: homecart-dev:latest
    environment:
      RAILS_ENV: development
    volumes:
      - .:/rails
      - bundle_cache:/usr/local/bundle
    command: ["bash", "-lc", "./bin/rails tailwindcss:watch[always]"]

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: homecart
      POSTGRES_PASSWORD: homecart
      POSTGRES_DB: homecart_development
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homecart -d homecart_development"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  bundle_cache:
  postgres_data:
  rails_storage:
